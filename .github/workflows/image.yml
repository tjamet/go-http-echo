name: image

# Built by the in-cluster Gitea Actions runner. Pushes go to the cluster's own
# registry; pull requests build without pushing.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/image.yml

permissions:
  contents: read

env:
  REGISTRY: zot.jamet.me
  IMAGE: tjamet/go-http-echo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ZOT_USERNAME/ZOT_PASSWORD are the org-level secrets on tjamet. The login
      # precedes buildx and runs on pull requests too: zot has no anonymous
      # read, and both the BuildKit image and the Dockerfile base images are
      # pulled through it. (Secrets are not exposed to fork PRs.)
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=zot.jamet.me/docker-hub/moby/buildkit:buildx-stable-1

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      # No cache-from/to: type=gha. The runner has the cache disabled, so the
      # backend cannot be resolved and an export would fail the build.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_REGISTRY=zot.jamet.me/docker-hub/library
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
