name: CI

# No branch filter: gitea.jamet.me and the GitHub mirrors may name their
# default branch differently, and one file has to serve both.
on:
  push:
  pull_request:

permissions:
  contents: read

# No lint job yet: go.mod says `go 1.17`, so setup-go installs Go 1.17, which
# current golangci-lint cannot run on. Lint is added in a later toolchain hop.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
