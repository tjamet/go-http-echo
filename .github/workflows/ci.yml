name: CI

# No branch filter: gitea.jamet.me and the GitHub mirrors may name their
# default branch differently, and one file has to serve both.
on:
  push:
  pull_request:

permissions:
  contents: read

# No lint job yet: go.mod says `go 1.14`, so setup-go installs Go 1.14, which
# current golangci-lint cannot run on. Lint is added in a later toolchain hop.

# Go 1.14 (installed by setup-go from go.mod) cannot parse the runner's
# pipe-separated GOPROXY (`|` needs Go >= 1.15). The override sits on each go
# step because a workflow-level `env:` does not beat the Gitea runner's
# container env. Remove it at the first toolchain hop that reaches Go >= 1.15.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go vet ./...

      - name: Build
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go build ./...

      - name: Test
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go test -race ./...
